name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  basic-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run existing unit tests
        run: python -m unittest discover tests -v

  prototype-tests:
    name: Prototype JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check syntax and scenario logic
        run: |
          node --check prototype/app.js
          node --check prototype/data.js
          node --check prototype/logic.js
          node --check prototype/live.js
          node --check prototype/star-map.js
          node --check prototype/career-explorer.js
          node --check prototype/simulator.js
          node --check prototype/questionnaire.js
          node --check prototype/i18n.js
          for file in prototype/local/*.js; do node --check "$file"; done
          node --test prototype/*.test.mjs
